[project]
name = "medigraph"
version = "0.1.0"
description = "Temporal clinical evidence reconciliation over a bitemporal patient knowledge graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Veena P V" }]
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.4.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "typer>=0.28.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.2.0",
]
api = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]
llm = [
    "anthropic[bedrock]>=1,<2", # SDK 2.x sends API version 2026-10-21, which Bedrock rejects for Haiku 4.5
]

[project.scripts]
medigraph = "medigraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".tools", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"] # long lines are left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --doctest-modules --import-mode=importlib"
markers = ["neo4j: needs a running local Neo4j (scripts/neo4j.sh start)"]
